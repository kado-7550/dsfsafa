<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직지, 선택의 기록 · 제1장</title>
<style>
:root{color-scheme:dark;--ink:#f7f0e1;--gold:#e2c481;--panel:#17211ed6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#34483a,#111814 78%);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:grid;place-items:center;padding:20px}
main{width:min(1120px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:0 2px 14px}
.brand small{display:block;color:var(--gold);font-size:.78rem;letter-spacing:.16em}.brand h1{font:700 clamp(1.3rem,3.4vw,2rem) Georgia,"Batang",serif;margin:4px 0 0}
button{font:inherit;color:#fff9e9;background:#31493a;border:1px solid #bca877;border-radius:8px;padding:9px 14px;cursor:pointer;transition:.15s}
button:hover,button:focus-visible{background:#49664f;transform:translateY(-1px);outline:2px solid #f3d58f;outline-offset:2px}
button.primary{background:#a3723e;border-color:#e0c287}
#restart{color:#eee7d6;background:#24372d;border:1px solid #a7986e;border-radius:9px;padding:8px 12px}
#stage{position:relative;overflow:hidden;border:1px solid #b69d68;border-radius:13px;background:#2e352b;box-shadow:0 24px 75px #0008;isolation:isolate}
svg{display:block;width:100%;height:auto;aspect-ratio:900/506}
#location{position:absolute;left:16px;top:15px;z-index:2;border:1px solid #f2e8cf66;border-radius:99px;background:#17211ebd;color:#f4ead1;padding:7px 12px;font-size:.8rem;letter-spacing:.04em}
#chapter{position:absolute;right:16px;top:15px;z-index:2;color:#fff4d7;text-shadow:0 1px 6px #000;font-size:.85rem}
#dialogue{position:absolute;left:3%;right:3%;bottom:2%;z-index:2;background:var(--panel);border:1px solid #d1bd8c;border-radius:12px;padding:10px 15px 9px;backdrop-filter:blur(5px);box-shadow:0 8px 28px #0006;min-height:0}
#speaker{display:inline-block;color:#f3d58f;font-weight:700;font-size:.9rem;margin-bottom:6px}
#text{white-space:pre-line;line-height:1.5;margin:0 0 8px;font-size:clamp(.93rem,1.7vw,1.08rem);min-height:0}
#actions{display:flex;flex-wrap:wrap;gap:8px}
.eyelid{position:absolute;left:0;right:0;height:0;z-index:5;pointer-events:none}
#eye-top{top:0;background:linear-gradient(#07080b 68%,#100d12);border-radius:0 0 50% 50% / 0 0 12% 12%}
#eye-bottom{bottom:0;background:linear-gradient(0deg,#07080b 68%,#100d12);border-radius:50% 50% 0 0 / 12% 12% 0 0}
#stage.closing #eye-top{animation:closeTop 1.75s cubic-bezier(.65,0,.8,.25) forwards}
#stage.closing #eye-bottom{animation:closeBottom 1.75s cubic-bezier(.65,0,.8,.25) forwards}
#stage.opening #eye-top{height:51%;animation:openTop 1.5s cubic-bezier(.2,.7,.3,1) forwards}
#stage.opening #eye-bottom{height:51%;animation:openBottom 1.5s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes closeTop{to{height:51%}}@keyframes closeBottom{to{height:51%}}
@keyframes openTop{to{height:0}}@keyframes openBottom{to{height:0}}
#stage.hit{animation:hit .38s ease-in-out}#stage.flinch{animation:flinch .26s ease-out}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}45%{transform:translateX(8px)}70%{transform:translateX(-4px)}}
@keyframes flinch{0%,100%{filter:brightness(1)}50%{filter:brightness(1.6)}}
#monk{transition:opacity .35s ease}#monk.hidden{opacity:0;display:none}#monk.visible{opacity:1;display:block}
#leftLeg,#rightLeg,#leftArm,#rightArm{transform-box:fill-box;transform-origin:center top}
#monk.walking #leftLeg{animation:stepLeft .32s ease-in-out infinite alternate}
#monk.walking #rightLeg{animation:stepRight .32s ease-in-out infinite alternate}
#monk.walking #leftArm{animation:armLeft .32s ease-in-out infinite alternate}
#monk.walking #rightArm{animation:armRight .32s ease-in-out infinite alternate}
@keyframes stepLeft{to{transform:rotate(-18deg) translateY(-3px)}}
@keyframes stepRight{to{transform:rotate(18deg) translateY(-3px)}}
@keyframes armLeft{to{transform:rotate(11deg)}}
@keyframes armRight{to{transform:rotate(-11deg)}}

#world{transform-origin:450px 253px}
#handStrike,#broomStrike{pointer-events:none}
#stage.impact{animation:impact .48s cubic-bezier(.2,.8,.25,1)}
@keyframes impact{0%,100%{transform:translate(0,0);filter:brightness(1)}12%{transform:translate(-13px,8px);filter:brightness(1.65)}30%{transform:translate(10px,-5px)}48%{transform:translate(-7px,3px)}68%{transform:translate(4px,0)}}
#stage.scan #world{filter:saturate(1.06)}
@media(prefers-reduced-motion:reduce){#stage.impact{animation-duration:.18s}}

footer{color:#bcb6a6;font-size:.82rem;text-align:center;margin:11px 0 0}
@media(max-width:620px){body{padding:8px}header{margin-bottom:8px}#dialogue{left:2%;right:2%;bottom:2%;padding:10px 12px;min-height:0}#text{line-height:1.5;margin-bottom:8px}#actions button{padding:8px 11px;font-size:.9rem}#location,#chapter{top:8px;font-size:.72rem}#location{left:8px}#chapter{right:8px}}
</style>
</head>

<script>
const q=(s)=>document.querySelector(s);
const stage=q("#stage"),home=q("#homeScene"),temple=q("#templeScene"),world=q("#world"),monk=q("#monk"),broom=q("#broom"),handStrike=q("#handStrike"),broomStrike=q("#broomStrike"),speaker=q("#speaker"),text=q("#text"),actions=q("#actions"),locationLabel=q("#location");
let runId=0;
let camera={x:0,y:0,s:1};
let monkPose={x:674,y:195,s:1};
const wait=(ms,id)=>new Promise(resolve=>setTimeout(()=>resolve(id===runId),ms));
function buttons(items){
  actions.replaceChildren();
  for(const item of items){
    const b=document.createElement("button");
    b.type="button";b.textContent=item.label;
    if(item.primary)b.className="primary";
    b.addEventListener("click",item.run);
    actions.append(b);
  }
}
function dialogue(name,line,items=[]){
  speaker.textContent=name;text.textContent=line;buttons(items);
}
function setScene(place){
  const isTemple=place==="temple";
  home.style.display=isTemple?"none":"";
  temple.style.display=isTemple?"":"none";
  locationLabel.textContent=isTemple?"고려 시대 · 절 안":"현재 · 침대에 누워서";
}
function setCamera(x,y,s){
  camera={x:x,y:y,s:s};
  world.setAttribute("transform","translate("+x+" "+y+") translate(450 253) scale("+s+") translate(-450 -253)");
}
function animateCamera(x,y,s,duration,id){
  const from={...camera},start=performance.now();
  return new Promise(resolve=>{
    function frame(now){
      if(id!==runId){resolve(false);return;}
      const t=Math.min(1,(now-start)/duration),e=t*t*(3-2*t);
      setCamera(from.x+(x-from.x)*e,from.y+(y-from.y)*e,from.s+(s-from.s)*e);
      if(t<1)requestAnimationFrame(frame);else resolve(true);
    }
    requestAnimationFrame(frame);
  });
}
function setMonkPose(x,y,s){
  monkPose={x:x,y:y,s:s};
  monk.setAttribute("transform","translate("+x+" "+y+") scale("+s+")");
}
function animateMonk(x,y,s,duration,id,walking=false){
  const from={...monkPose},start=performance.now();
  if(walking)monk.classList.add("walking");
  return new Promise(resolve=>{
    function frame(now){
      if(id!==runId){monk.classList.remove("walking");resolve(false);return;}
      const t=Math.min(1,(now-start)/duration),e=t*t*(3-2*t);
      setMonkPose(from.x+(x-from.x)*e,from.y+(y-from.y)*e,from.s+(s-from.s)*e);
      if(t<1)requestAnimationFrame(frame);else{monk.classList.remove("walking");resolve(true);}
    }
    requestAnimationFrame(frame);
  });
}
function animateProp(el,from,to,duration,id){
  el.style.display="";
  el.style.opacity="1";
  const start=performance.now();
  return new Promise(resolve=>{
    function frame(now){
      if(id!==runId){el.style.display="none";resolve(false);return;}
      const t=Math.min(1,(now-start)/duration),e=t*t*(3-2*t);
      const x=from.x+(to.x-from.x)*e,y=from.y+(to.y-from.y)*e,a=from.a+(to.a-from.a)*e;
      el.setAttribute("transform","translate("+x+" "+y+") rotate("+a+")");
      if(t<1)requestAnimationFrame(frame);else resolve(true);
    }
    requestAnimationFrame(frame);
  });
}
function closeEyes(id,duration=1750){
  stage.classList.remove("opening","closing");void stage.offsetWidth;stage.classList.add("closing");
  return wait(duration,id).then(ok=>{if(ok)stage.classList.remove("closing");return ok;});
}
function openEyes(id,duration=1500){
  stage.classList.remove("closing","opening");void stage.offsetWidth;stage.classList.add("opening");
  return wait(duration,id).then(ok=>{if(ok)stage.classList.remove("opening");return ok;});
}
async function impact(id){
  stage.classList.remove("impact");void stage.offsetWidth;stage.classList.add("impact");
  const ok=await wait(430,id);
  if(ok)stage.classList.remove("impact");
  return ok;
}
function reset(){
  runId++;
  stage.classList.remove("closing","opening","impact","scan","hit","flinch");
  setScene("home");setCamera(0,0,1);
  monk.setAttribute("class","hidden");setMonkPose(674,195,1);broom.style.display="none";
  handStrike.style.display="none";broomStrike.style.display="none";
  dialogue("당신","집에 돌아와 침대에 누웠습니다.\n“이제 좀 자야겠다.”",[{label:"잠든다",primary:true,run:sleepToTemple}]);
}
async function sleepToTemple(){
  const id=++runId;
  dialogue("당신","몸을 침대에 눕히자 천장이 흐릿해집니다. 눈꺼풀이 천천히 내려오고, 당신은 잠에 빠져듭니다.");
  if(!await wait(700,id))return;
  if(!await closeEyes(id))return;
  setScene("temple");setCamera(0,0,1);monk.setAttribute("class","hidden");broom.style.display="none";
  if(!await wait(350,id))return;
  if(!await openEyes(id))return;
  stage.classList.add("scan");
  if(!await animateCamera(-18,1,1.04,700,id))return;
  if(!await animateCamera(16,-2,1.045,850,id))return;
  if(!await animateCamera(0,0,1,520,id))return;
  stage.classList.remove("scan");
  showWake();
}
function showWake(){
  dialogue("당신","눈을 떠 보니 낯선 절 안입니다.\n“여긴 어디지?” 당신은 어리둥절한 채 주위를 살폈습니다.",[
    {label:"주변을 둘러본다",primary:true,run:lookAround},
    {label:"다시 잔다",run:dozeAgain}
  ]);
}
async function lookAround(){
  const id=++runId;
  dialogue("당신","천천히 주위를 둘러봅니다. 멀리서 발소리가 들리고, 스님 한 분이 이쪽으로 다가옵니다.");
  stage.classList.add("scan");
  monk.setAttribute("class","visible");setMonkPose(810,251,.48);
  if(!await animateCamera(-34,0,1.06,620,id))return;
  if(!await animateMonk(715,230,.62,500,id,true))return;
  if(!await animateCamera(21,-2,1.08,480,id))return;
  if(!await animateMonk(565,155,1.08,1050,id,true))return;
  if(!await animateCamera(0,0,1.02,420,id))return;
  stage.classList.remove("scan");
  dialogue("당신","스님이 바로 앞까지 다가왔습니다. 그 순간, 스님의 손이 눈앞으로 날아옵니다.");
  if(!await animateProp(handStrike,{x:1050,y:45,a:-18},{x:755,y:65,a:-5},520,id))return;
  if(!await impact(id))return;
  handStrike.style.display="none";
  if(!await animateCamera(-9,4,1.055,300,id))return;
  dialogue("당신","스님에게 머리를 맞았습니다!\n“아야!” 아픈 머리를 감싸며 옆을 돌아봅니다.",[
    {label:"옆을 돌아본다",primary:true,run:meetMonk}
  ]);
}
async function dozeAgain(){
  const id=++runId;
  dialogue("당신","“꿈이겠지… 조금만 더 자자.” 다시 눈을 감습니다.");
  if(!await wait(400,id))return;
  if(!await closeEyes(id,1350))return;
  setCamera(0,0,1);monk.setAttribute("class","visible");setMonkPose(760,240,.58);broom.style.display="";
  if(!await wait(380,id))return;
  if(!await openEyes(id,1250))return;
  dialogue("당신","눈을 뜨자 스님이 빗자루를 들고 서 있습니다. 스님이 빗자루를 크게 휘두릅니다!");
  if(!await animateMonk(570,155,1.08,820,id,true))return;
  if(!await animateProp(broomStrike,{x:700,y:-80,a:-10},{x:375,y:35,a:30},560,id))return;
  if(!await impact(id))return;
  broomStrike.style.display="none";broom.style.display="none";
  if(!await animateCamera(8,5,1.06,300,id))return;
  dialogue("당신","빗자루에 맞아 정신이 번쩍 듭니다!\n“아야! 누구야?!!”",[
    {label:"소리가 난 쪽을 본다",primary:true,run:meetMonk}
  ]);
}
async function meetMonk(){
  const id=++runId;
  handStrike.style.display="none";broomStrike.style.display="none";broom.style.display="none";
  stage.classList.add("scan");
  dialogue("당신","옆을 돌아보자, 스님이 눈앞에 서 있습니다.");
  if(!await animateCamera(12,0,1.04,430,id))return;
  if(!await animateMonk(505,165,1.12,620,id,true))return;
  stage.classList.remove("scan");
  dialogue("스님","스님이 가까이 다가와 묻습니다.\n“여기서 뭐 하는 게냐?”",[
    {label:"깜짝 놀라 비명을 지른다",primary:true,run:scream}
  ]);
}
async function scream(){
  const id=++runId;
  dialogue("당신","“으아아악!” 깜짝 놀란 당신의 비명이 절 안에 울려 퍼집니다.");
  stage.classList.remove("flinch");void stage.offsetWidth;stage.classList.add("flinch");
  if(!await wait(950,id))return;
  stage.classList.remove("flinch");
  dialogue("당신","스님은 놀란 표정으로 당신을 바라봅니다. 제1장의 이야기가 계속됩니다.",[
    {label:"제1장 다시 보기",primary:true,run:reset}
  ]);
}
q("#restart").addEventListener("click",reset);
reset();
</script>
