<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직지, 선택의 기록</title>
<style>
:root{color-scheme:light;--ink:#253329;--muted:#6d756a;--paper:#f4edda;--card:#fffaf0;--green:#315b45;--gold:#bd8a3a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#fff9e9 0,#e8dcc0 70%);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(760px,100%);background:var(--card);border:1px solid #d9c9a7;border-radius:20px;box-shadow:0 18px 55px #46391d20;overflow:hidden}
header{padding:30px 34px 24px;background:var(--green);color:#fff9e9}
.kicker{font-size:.82rem;letter-spacing:.16em;color:#e9cc91}h1{font-family:Georgia,"Batang",serif;font-size:clamp(2rem,7vw,3.2rem);margin:9px 0 5px}header p{margin:0;color:#e9eadf}
.progress{height:5px;background:#d9ceb7}.progress span{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
section{padding:34px;min-height:310px}.chapter{color:#99743d;font-weight:700;font-size:.9rem}h2{font-size:1.5rem;margin:10px 0 16px}.story{font-size:1.08rem;line-height:1.9;white-space:pre-line;color:#394238;min-height:94px}
.choices{display:grid;gap:10px;margin-top:24px}.choices button,.restart{border:1px solid #d3c4a5;background:#fffdf7;color:var(--ink);padding:14px 16px;border-radius:12px;text-align:left;font:inherit;cursor:pointer;transition:.15s}
.choices button:hover,.choices button:focus-visible{border-color:var(--green);background:#eef3e9;transform:translateY(-1px);outline:none}
footer{padding:0 34px 26px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;gap:12px;align-items:center}
.restart{padding:9px 13px;font-size:.9rem;color:var(--green);border-color:#b6c3b2}
@media(max-width:520px){body{padding:12px}header,section{padding:24px}footer{padding:0 24px 22px}section{min-height:340px}}
</style>
</head>
<body>
<main>
<header><div class="kicker">역사 선택 게임 · 제1장</div><h1>직지, 선택의 기록</h1><p>현재에서 고려 시대로 넘어온 당신의 이야기</p></header>
<div class="progress" aria-label="이야기 진행"><span id="progress"></span></div>
<section aria-live="polite">
<div class="chapter" id="chapter"></div><h2 id="title"></h2><p class="story" id="story"></p><div class="choices" id="choices"></div>
</section>
<footer><span id="step">이야기를 시작해 보세요.</span><button class="restart" id="restart" type="button">처음부터</button></footer>
</main>
<script>
const scenes={
start:{chapter:"제1장 · 낯선 곳에서 눈을 뜨다",title:"여긴 어디지?",text:"집에 돌아온 당신은 침대에 누우며 말했습니다. “이제 좀 자야겠다.”\n\n잠이 든 뒤 눈을 떠 보니, 눈앞에는 고려 시대의 절이 펼쳐져 있었습니다. 낯선 풍경에 놀란 당신은 “여긴 어디지?”라고 중얼거리며 주위를 살폈습니다.",choices:[["주변을 둘러본다","look"],["다시 잔다","sleep"]]},
look:{chapter:"제1장 · 주변을 둘러본다",title:"아야!",text:"주변을 둘러보던 순간, 누군가가 당신의 머리를 툭 쳤습니다. “아야!” 아픈 머리를 감싸 쥔 당신은 놀라서 옆을 돌아보려 합니다.",choices:[["아픈 머리를 감싸고 옆을 본다","monk"]]},
sleep:{chapter:"제1장 · 다시 잔다",title:"누구야?!!",text:"“꿈이겠지. 다시 자야겠다.” 눈을 감은 순간, 누군가가 빗자루로 당신을 때렸습니다. “아야! 누구야?!!” 놀란 당신은 소리가 난 쪽을 돌아보려 합니다.",choices:[["소리가 난 쪽을 돌아본다","monk"]]},
monk:{chapter:"제1장 · 두 선택이 만나는 장면",title:"스님과 마주치다",text:"옆을 돌아보니 스님이 서 있었습니다. 스님은 “여기서 뭐 하는 게냐?”라고 말하며 가까이 다가왔습니다. 갑자기 다가오는 모습에 깜짝 놀란 당신은 비명을 질렀습니다.",ending:"제1장 — 스님과 마주친 순간"}
};
let current="start",count=0;
const chapter=document.querySelector("#chapter"),title=document.querySelector("#title"),story=document.querySelector("#story"),choices=document.querySelector("#choices"),step=document.querySelector("#step"),progress=document.querySelector("#progress");
function show(id){current=id;const s=scenes[id];chapter.textContent=s.chapter;title.textContent=s.title;story.textContent=s.text;choices.replaceChildren();if(s.ending){const done=document.createElement("p");done.textContent="— "+s.ending+" —";done.style.color="#315b45";done.style.fontWeight="700";choices.append(done);step.textContent="제1장 이야기는 여기까지예요. 다음 내용을 이어 붙일 수 있어요.";progress.style.width="100%";return}
s.choices.forEach(([label,next])=>{const b=document.createElement("button");b.type="button";b.textContent=label;b.addEventListener("click",()=>{count++;step.textContent=count+"번 선택했어요.";progress.style.width=Math.min(25+count*25,90)+"%";show(next)});choices.append(b)})}
document.querySelector("#restart").addEventListener("click",()=>{count=0;progress.style.width="0";show("start");step.textContent="첫 장을 펼쳐 보세요."});
show("start");
</script>
</body>
</html>
