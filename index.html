<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직지, 선택의 기록 · 제1장</title>
<style>
:root{color-scheme:dark;--ink:#f6f0df;--muted:#d0c9b6;--gold:#d5b46f;--green:#294536;--panel:#17211edc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#314439,#101714 78%);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:grid;place-items:center;padding:20px}
main{width:min(1120px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:0 2px 14px}
.brand small{display:block;color:var(--gold);font-size:.78rem;letter-spacing:.16em}.brand h1{font:700 clamp(1.3rem,3.4vw,2rem) Georgia,"Batang",serif;margin:4px 0 0}
#restart{color:#eee7d6;background:#24372d;border:1px solid #a7986e;border-radius:9px;padding:8px 12px;font:inherit;cursor:pointer}
#stage{position:relative;overflow:hidden;border:1px solid #b69d68;border-radius:13px;background:#2e352b;box-shadow:0 24px 75px #0008;isolation:isolate}
svg{display:block;width:100%;height:auto;aspect-ratio:900/506}
#homeScene,#templeScene{transition:opacity .45s ease}#hero,#monk{transition:transform .55s ease,opacity .3s ease}
#hero.hidden,#monk.hidden{opacity:0;display:none}#hero.visible,#monk.visible{opacity:1;display:block}
#monk.approach{transform:translate(520px 183px)}
#broom.hidden{display:none}
#location{position:absolute;left:16px;top:15px;border:1px solid #f2e8cf66;border-radius:99px;background:#17211ebd;color:#f4ead1;padding:7px 12px;font-size:.8rem;letter-spacing:.04em}
#chapter{position:absolute;right:16px;top:15px;color:#fff4d7;text-shadow:0 1px 6px #000;font-size:.85rem}
#dialogue{position:absolute;left:3%;right:3%;bottom:3%;background:var(--panel);border:1px solid #d1bd8c;border-radius:12px;padding:15px 18px 14px;backdrop-filter:blur(5px);box-shadow:0 8px 28px #0006;min-height:132px}
#speaker{display:inline-block;color:#f3d58f;font-weight:700;font-size:.9rem;margin-bottom:6px}
#text{white-space:pre-line;line-height:1.7;margin:0 0 12px;font-size:clamp(.93rem,1.7vw,1.08rem);min-height:2.2em}
#actions{display:flex;flex-wrap:wrap;gap:8px}
#actions button{font:inherit;color:#fff9e9;background:#31493a;border:1px solid #bca877;border-radius:8px;padding:9px 14px;cursor:pointer;transition:.15s}
#actions button:hover,#actions button:focus-visible{background:#49664f;transform:translateY(-1px);outline:2px solid #f3d58f;outline-offset:2px}
#actions button.primary{background:#a3723e;border-color:#e0c287}
footer{color:#bcb6a6;font-size:.82rem;text-align:center;margin:11px 0 0}
@media(max-width:620px){body{padding:8px}header{margin-bottom:8px}#dialogue{left:2%;right:2%;bottom:2%;padding:10px 12px;min-height:118px}#text{line-height:1.5;margin-bottom:8px}#actions button{padding:8px 11px;font-size:.9rem}#location,#chapter{top:8px;font-size:.72rem}#location{left:8px}#chapter{right:8px}}
</style>
</head>
<body>
<main>
<header><div class="brand"><small>선택형 스토리 어드벤처 · 제1장</small><h1>직지, 선택의 기록</h1></div><button id="restart" type="button">처음부터</button></header>
<section id="stage" aria-label="게임 장면">
<div id="location">집 · 밤</div><div id="chapter">제1장</div>
<svg viewBox="0 0 900 506" role="img" aria-label="집과 고려 시대 절을 배경으로 진행되는 이야기 장면">
<defs>
<linearGradient id="room" x2="0" y2="1"><stop stop-color="#8d7960"/><stop offset="1" stop-color="#4b493d"/></linearGradient>
<linearGradient id="temple" x2="0" y2="1"><stop stop-color="#c9a977"/><stop offset="1" stop-color="#71513b"/></linearGradient>
<linearGradient id="night" x2="0" y2="1"><stop stop-color="#182738"/><stop offset="1" stop-color="#526174"/></linearGradient>
<linearGradient id="floor" x2="0" y2="1"><stop stop-color="#9c7045"/><stop offset="1" stop-color="#4f3829"/></linearGradient>
<linearGradient id="hoodie" x2="0" y2="1"><stop stop-color="#54715d"/><stop offset="1" stop-color="#253c32"/></linearGradient>
<linearGradient id="robe" x2="0" y2="1"><stop stop-color="#bb684b"/><stop offset="1" stop-color="#713a30"/></linearGradient>
<filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<!-- present-day bedroom illustration -->
<g id="homeScene">
<rect width="900" height="506" fill="url(#room)"/><rect y="357" width="900" height="149" fill="url(#floor)"/>
<path d="M0 359H900M0 409H900M0 463H900" stroke="#392b20" stroke-width="7" opacity=".7"/>
<rect x="88" y="64" width="226" height="176" rx="4" fill="#3b3025"/><rect x="100" y="76" width="202" height="152" fill="url(#night)"/>
<circle cx="246" cy="117" r="28" fill="#e6d6a2"/><path d="M100 196Q138 147 169 188T235 171T302 190V228H100Z" fill="#354d57"/>
<path d="M639 135H808V359H639Z" fill="#45372b"/><path d="M650 147H797V347H650Z" fill="#88704f"/><path d="M655 152H792V340H655Z" fill="#a58b66"/><circle cx="779" cy="245" r="5" fill="#e3c57d"/>
<path d="M139 350H586V416H139Z" fill="#362a22"/><path d="M126 315H597V372H126Z" fill="#9b7951"/><path d="M140 301H582V346H140Z" fill="#d6c4a2"/>
<ellipse cx="370" cy="325" rx="134" ry="39" fill="#eee2c7"/><path d="M264 325Q296 275 390 287Q472 297 501 335L479 365H277Z" fill="#80483d"/>
<!-- a sleeping modern student -->
<circle cx="341" cy="294" r="28" fill="#e4b998"/><path d="M313 292Q315 255 351 261Q377 266 371 302L360 283L335 296L319 309Z" fill="#282823"/>
<path d="M361 323Q406 296 467 331L493 355H369Z" fill="#385363"/><path d="M331 323Q356 313 374 327" stroke="#263847" stroke-width="15" stroke-linecap="round"/>
<path d="M45 333H118" stroke="#ead9af" stroke-width="3" opacity=".5"/><text x="35" y="465" fill="#f2e3c1" font-size="18" font-weight="700">현재 · 집</text>
</g>
<!-- Goryeo temple interior illustration -->
<g id="templeScene" style="display:none">
<rect width="900" height="506" fill="url(#temple)"/><rect y="347" width="900" height="159" fill="url(#floor)"/>
<path d="M0 348H900M0 391H900M0 444H900" stroke="#4b3022" stroke-width="7" opacity=".72"/>
<!-- roof beams, pillars, depth -->
<path d="M0 36H900M0 87H900" stroke="#71392d" stroke-width="22"/><path d="M73 30V352M826 30V352" stroke="#794333" stroke-width="30"/>
<path d="M28 34H119L101 12H49ZM781 34H872L851 12H801Z" fill="#a65139"/>
<path d="M112 104H294V264H112Z" fill="#e8d7b2" stroke="#7d4432" stroke-width="9"/>
<path d="M157 106V263M203 106V263M249 106V263M113 158H293M113 210H293" stroke="#96513b" stroke-width="5"/>
<!-- altar/books and hanging scroll -->
<rect x="656" y="114" width="151" height="201" rx="4" fill="#8e5737" stroke="#633c2c" stroke-width="7"/><rect x="671" y="130" width="121" height="35" fill="#4b3529"/><rect x="671" y="180" width="121" height="35" fill="#4b3529"/><rect x="671" y="230" width="121" height="35" fill="#4b3529"/>
<g fill="#ddc99d" stroke="#785638" stroke-width="3"><rect x="681" y="121" width="18" height="45" rx="4"/><rect x="708" y="124" width="18" height="42" rx="4"/><rect x="758" y="120" width="18" height="46" rx="4"/><rect x="687" y="171" width="19" height="45" rx="4"/><rect x="739" y="173" width="18" height="43" rx="4"/><rect x="770" y="170" width="16" height="46" rx="4"/><rect x="675" y="220" width="19" height="46" rx="4"/><rect x="718" y="222" width="18" height="45" rx="4"/><rect x="758" y="221" width="18" height="45" rx="4"/></g>
<path d="M420 109V226" stroke="#8d3e30" stroke-width="5"/><path d="M378 119H462V218H378Z" fill="#e1c99a" stroke="#8d3e30" stroke-width="5"/><text x="395" y="177" fill="#6e3c2d" font-size="25" font-family="serif">直指</text>
<ellipse cx="451" cy="382" rx="182" ry="32" fill="#261d18" opacity=".34" filter="url(#shadow)"/><path d="M271 370Q450 331 630 370L591 418H308Z" fill="#a87345" stroke="#65432d" stroke-width="6"/><path d="M305 375Q450 346 598 375" stroke="#dfb66d" stroke-width="5" fill="none"/>
<text x="35" y="465" fill="#f2e3c1" font-size="18" font-weight="700">고려 시대 · 절 안</text>
</g>
<!-- protagonist, modern clothes -->
<g id="hero" class="hidden" transform="translate(315 230)">
<ellipse cx="62" cy="208" rx="56" ry="13" fill="#241a16" opacity=".5"/>
<path d="M33 104Q61 83 93 103L111 178L99 205H22L12 174Z" fill="url(#hoodie)" stroke="#1e3028" stroke-width="4"/>
<path d="M43 107L62 130L81 107" fill="#d8d3c3"/><path d="M58 129H66V178H57Z" fill="#a6473e"/>
<path d="M20 119L2 168M103 119L123 161" stroke="#e3b99a" stroke-width="17" stroke-linecap="round"/>
<path d="M31 179L27 209M84 179L91 209" stroke="#32445a" stroke-width="20" stroke-linecap="round"/>
<path d="M17 213H42M78 213H104" stroke="#ddd7c8" stroke-width="12" stroke-linecap="round"/>
<ellipse cx="62" cy="67" rx="36" ry="42" fill="#e6b99a" stroke="#9d6d56" stroke-width="2"/>
<path d="M27 69Q21 24 63 23Q101 24 99 66L88 52Q70 59 44 47L29 75Z" fill="#242622"/>
<path d="M39 74Q45 78 50 74M74 74Q80 78 85 74" stroke="#3a302b" stroke-width="4" fill="none"/>
<path d="M55 96Q63 91 72 96" stroke="#9a584d" stroke-width="3" fill="none"/>
</g>
<!-- monk appears on branch and shared scene -->
<g id="monk" class="hidden" transform="translate(650 225)">
<ellipse cx="55" cy="210" rx="55" ry="12" fill="#241a16" opacity=".5"/>
<path d="M24 103Q54 83 86 104L106 184L95 207H12L4 176Z" fill="url(#robe)" stroke="#653a2e" stroke-width="4"/>
<path d="M44 105L58 126L74 105" fill="#e1d0a7"/><path d="M55 124L64 132L60 184H49Z" fill="#d8bd7d"/>
<path d="M18 121L-2 166M92 120L113 157" stroke="#c99372" stroke-width="16" stroke-linecap="round"/>
<path d="M28 180L23 210M79 180L87 210" stroke="#544438" stroke-width="20" stroke-linecap="round"/>
<ellipse cx="56" cy="67" rx="35" ry="41" fill="#d7a681" stroke="#8e5d48" stroke-width="2"/>
<path d="M22 62Q25 26 57 25Q88 27 91 63L80 51Q55 58 31 48Z" fill="#58483d"/>
<path d="M35 73H48M66 73H79" stroke="#45332d" stroke-width="4"/><path d="M45 93Q57 88 68 93" stroke="#78463a" stroke-width="3" fill="none"/>
<g id="broom" class="hidden"><path d="M105 144L150 60" stroke="#684a2e" stroke-width="9" stroke-linecap="round"/><path d="M134 45L164 62L146 84L124 67Z" fill="#caa660" stroke="#684a2e" stroke-width="4"/></g>
</g>
</svg>
<div id="dialogue"><span id="speaker">당신</span><p id="text"></p><div id="actions"></div></div>
</section>
<footer>제1장 · 현재에서 고려 시대로</footer>
</main>
<script>
const q=(s)=>document.querySelector(s),home=q("#homeScene"),temple=q("#templeScene"),hero=q("#hero"),monk=q("#monk"),broom=q("#broom"),speaker=q("#speaker"),text=q("#text"),actions=q("#actions"),locationLabel=q("#location"),stage=q("#stage");
function buttons(items){actions.replaceChildren();for(const item of items){const b=document.createElement("button");b.type="button";b.textContent=item.label;if(item.primary)b.className="primary";b.addEventListener("click",item.run);actions.append(b)}}
function scene(place){const isTemple=place==="temple";home.style.display=isTemple?"none":"";temple.style.display=isTemple?"":"none";locationLabel.textContent=isTemple?"고려 시대 · 절 안":"현재 · 집"}
function dialogue(name,line,items){speaker.textContent=name;text.textContent=line;buttons(items);stage.classList.remove("scene-change");void stage.offsetWidth;stage.classList.add("scene-change")}
function reset(){scene("home");hero.setAttribute("class","hidden");monk.setAttribute("class","hidden");monk.classList.remove("approach");broom.setAttribute("class","hidden");dialogue("당신","집에 돌아온 당신은 침대에 누우며 말했습니다.\n“이제 좀 자야겠다.”",[{label:"잠든다",primary:true,run:wake}])}
function wake(){scene("temple");hero.setAttribute("class","visible");dialogue("당신","눈을 떠 보니 고려 시대의 절이었습니다.\n“여긴 어디지?” 어리둥절한 당신은 주위를 살폈습니다.",[{label:"주변을 둘러본다",primary:true,run:look},{label:"다시 잔다",run:sleep}])}
function look(){dialogue("당신","주변을 둘러보다가 누군가 머리를 툭 쳤습니다.\n“아야!” 아픈 머리를 감싸고 옆을 돌아봤습니다.",[{label:"옆을 본다",primary:true,run:meet}])}
function sleep(){hero.style.opacity=".55";monk.setAttribute("class","visible");broom.setAttribute("class","");dialogue("당신","다시 잠을 청하려는 순간, 스님이 빗자루로 당신을 때렸습니다!",[{label:"아야! 누구야?!!",primary:true,run:turnAfterBroom}])}
function turnAfterBroom(){hero.style.opacity="1";dialogue("당신","“누구야?!!” 소리치며 옆을 돌아봤습니다.",[{label:"옆을 본다",primary:true,run:meet}])}
function meet(){hero.style.opacity="1";monk.setAttribute("class","visible");monk.classList.add("approach");broom.setAttribute("class","hidden");dialogue("스님","옆을 보니 스님이 서 있었습니다.\n“여기서 뭐 하는 게냐?” 스님이 가까이 다가오자, 깜짝 놀란 당신은 비명을 질렀습니다.",[{label:"제1장 다시 보기",primary:true,run:reset}])}
q("#restart").addEventListener("click",reset);reset();
</script>
</body>
</html>
