<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직지, 선택의 기록 · 제1장</title>
<style>
:root{color-scheme:dark;--ink:#f7f0e1;--gold:#e2c481;--panel:#17211ee8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#34483a,#111814 78%);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:grid;place-items:center;padding:20px}
main{width:min(1120px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:0 2px 14px}
.brand small{display:block;color:var(--gold);font-size:.78rem;letter-spacing:.16em}.brand h1{font:700 clamp(1.3rem,3.4vw,2rem) Georgia,"Batang",serif;margin:4px 0 0}
button{font:inherit;color:#fff9e9;background:#31493a;border:1px solid #bca877;border-radius:8px;padding:9px 14px;cursor:pointer;transition:.15s}
button:hover,button:focus-visible{background:#49664f;transform:translateY(-1px);outline:2px solid #f3d58f;outline-offset:2px}
button.primary{background:#a3723e;border-color:#e0c287}
#restart{color:#eee7d6;background:#24372d;border:1px solid #a7986e;border-radius:9px;padding:8px 12px}
#stage{position:relative;overflow:hidden;border:1px solid #b69d68;border-radius:13px;background:#2e352b;box-shadow:0 24px 75px #0008;isolation:isolate}
svg{display:block;width:100%;height:auto;aspect-ratio:900/506}
#location{position:absolute;left:16px;top:15px;z-index:2;border:1px solid #f2e8cf66;border-radius:99px;background:#17211ebd;color:#f4ead1;padding:7px 12px;font-size:.8rem;letter-spacing:.04em}
#chapter{position:absolute;right:16px;top:15px;z-index:2;color:#fff4d7;text-shadow:0 1px 6px #000;font-size:.85rem}
#dialogue{position:absolute;left:3%;right:3%;bottom:3%;z-index:2;background:var(--panel);border:1px solid #d1bd8c;border-radius:12px;padding:15px 18px 14px;backdrop-filter:blur(5px);box-shadow:0 8px 28px #0006;min-height:132px}
#speaker{display:inline-block;color:#f3d58f;font-weight:700;font-size:.9rem;margin-bottom:6px}
#text{white-space:pre-line;line-height:1.7;margin:0 0 12px;font-size:clamp(.93rem,1.7vw,1.08rem);min-height:2.2em}
#actions{display:flex;flex-wrap:wrap;gap:8px}
.eyelid{position:absolute;left:0;right:0;height:0;z-index:5;pointer-events:none}
#eye-top{top:0;background:linear-gradient(#07080b 68%,#100d12);border-radius:0 0 50% 50% / 0 0 12% 12%}
#eye-bottom{bottom:0;background:linear-gradient(0deg,#07080b 68%,#100d12);border-radius:50% 50% 0 0 / 12% 12% 0 0}
#stage.closing #eye-top{animation:closeTop 1.75s cubic-bezier(.65,0,.8,.25) forwards}
#stage.closing #eye-bottom{animation:closeBottom 1.75s cubic-bezier(.65,0,.8,.25) forwards}
#stage.opening #eye-top{height:51%;animation:openTop 1.5s cubic-bezier(.2,.7,.3,1) forwards}
#stage.opening #eye-bottom{height:51%;animation:openBottom 1.5s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes closeTop{to{height:51%}}@keyframes closeBottom{to{height:51%}}
@keyframes openTop{to{height:0}}@keyframes openBottom{to{height:0}}
#stage.hit{animation:hit .38s ease-in-out}#stage.flinch{animation:flinch .26s ease-out}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}45%{transform:translateX(8px)}70%{transform:translateX(-4px)}}
@keyframes flinch{0%,100%{filter:brightness(1)}50%{filter:brightness(1.6)}}
#monk{transition:transform .6s ease,opacity .35s ease}#monk.hidden{opacity:0;display:none}#monk.visible{opacity:1;display:block}
footer{color:#bcb6a6;font-size:.82rem;text-align:center;margin:11px 0 0}
@media(max-width:620px){body{padding:8px}header{margin-bottom:8px}#dialogue{left:2%;right:2%;bottom:2%;padding:10px 12px;min-height:118px}#text{line-height:1.5;margin-bottom:8px}#actions button{padding:8px 11px;font-size:.9rem}#location,#chapter{top:8px;font-size:.72rem}#location{left:8px}#chapter{right:8px}}
</style>
</head>
<body>
<main>
<header><div class="brand"><small>1인칭 선택형 스토리 어드벤처 · 제1장</small><h1>직지, 선택의 기록</h1></div><button id="restart" type="button">처음부터</button></header>
<section id="stage" aria-label="1인칭 시점으로 진행되는 게임 장면">
<div id="location">현재 · 침대에 누워서</div><div id="chapter">제1장</div>
<svg viewBox="0 0 900 506" role="img" aria-label="누워서 바라보는 방과 고려 시대 절의 시야">
<defs>
<linearGradient id="bedroom" x2="0" y2="1"><stop stop-color="#233249"/><stop offset=".43" stop-color="#687487"/><stop offset="1" stop-color="#9b866a"/></linearGradient>
<linearGradient id="ceiling" x2="0" y2="1"><stop stop-color="#ddc9a1"/><stop offset="1" stop-color="#947858"/></linearGradient>
<linearGradient id="templewall" x2="0" y2="1"><stop stop-color="#b99565"/><stop offset=".55" stop-color="#896344"/><stop offset="1" stop-color="#4d382b"/></linearGradient>
<linearGradient id="blanket" x2="0" y2="1"><stop stop-color="#55707c"/><stop offset="1" stop-color="#263e4c"/></linearGradient>
<linearGradient id="robe" x2="0" y2="1"><stop stop-color="#c77955"/><stop offset="1" stop-color="#793c31"/></linearGradient>
<filter id="softshadow"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<!-- Lying-down first-person view of the bedroom -->
<g id="homeScene">
<rect width="900" height="506" fill="url(#bedroom)"/>
<path d="M0 0H900V270Q670 238 450 257Q230 235 0 275Z" fill="url(#ceiling)"/>
<path d="M0 54Q430 114 900 54M0 121Q430 169 900 121M0 190Q430 219 900 190" fill="none" stroke="#715b42" stroke-width="9" opacity=".75"/>
<path d="M0 272Q450 235 900 272V377Q450 341 0 377Z" fill="#847459"/>
<!-- window and moon, seen from the pillow -->
<path d="M82 116H254V252H82Z" fill="#40362e" stroke="#6f583f" stroke-width="13"/><rect x="94" y="128" width="148" height="112" fill="#24354a"/>
<circle cx="211" cy="156" r="20" fill="#e8d8ab"/><path d="M95 222Q132 188 160 217T242 211V239H95Z" fill="#47606a"/>
<path d="M602 155H745V280H602Z" fill="#766248"/><path d="M613 166H734V271H613Z" fill="#5a4937"/><circle cx="718" cy="218" r="4" fill="#e6c87e"/>
<!-- faint ceiling lamp in the distance -->
<path d="M445 0V73" stroke="#514735" stroke-width="5"/><path d="M411 70Q450 43 489 70L477 91H423Z" fill="#dfc98e" opacity=".8"/>
<ellipse cx="450" cy="93" rx="85" ry="25" fill="#f5daa0" opacity=".17" filter="url(#softshadow)"/>
<!-- blanket at the foot of the first-person view -->
<path d="M0 362Q180 328 337 365Q526 325 708 366Q822 343 900 361V506H0Z" fill="url(#blanket)"/>
<path d="M0 390Q204 354 372 392T725 389T900 382M0 454Q188 419 357 451T716 450T900 437" fill="none" stroke="#91a0a0" stroke-width="4" opacity=".48"/>
<path d="M386 506Q411 417 450 375Q488 420 514 506" fill="#6b8290" opacity=".56"/>
<path d="M0 0H900V506H0Z" fill="none" stroke="#10151c" stroke-width="45" opacity=".14"/>
</g>
<!-- First-person view from the temple floor, looking upward -->
<g id="templeScene" style="display:none">
<rect width="900" height="506" fill="url(#templewall)"/>
<!-- roof underside and converging rafters -->
<path d="M0 0H900V263Q687 226 450 213Q212 227 0 263Z" fill="#634332"/>
<path d="M0 0L450 244L900 0M0 58L450 269L900 58M0 119L450 291L900 119" fill="none" stroke="#a45e3c" stroke-width="18"/>
<path d="M0 176L450 312L900 176M0 229L450 332L900 229" fill="none" stroke="#422f25" stroke-width="12"/>
<path d="M0 271Q450 231 900 271V506H0Z" fill="#97734e"/>
<!-- view toward the far wall, with lattice windows -->
<path d="M85 281H342V412H85Z" fill="#dfc79b" stroke="#694534" stroke-width="13"/>
<path d="M149 284V408M213 283V408M277 283V408M89 324H338M89 367H338" stroke="#89553c" stroke-width="6"/>
<path d="M555 282H811V413H555Z" fill="#6e4b36" stroke="#503628" stroke-width="12"/>
<path d="M581 300H785V394H581Z" fill="#bb9663"/>
<g fill="#e3d0a7" stroke="#704c34" stroke-width="3"><rect x="592" y="296" width="21" height="96" rx="4"/><rect x="623" y="302" width="21" height="90" rx="4"/><rect x="678" y="298" width="21" height="94" rx="4"/><rect x="738" y="300" width="21" height="92" rx="4"/></g>
<!-- hanging wooden plaque -->
<path d="M445 0V105" stroke="#553829" stroke-width="7"/><path d="M385 91H515V188H385Z" fill="#d1b47d" stroke="#593a2a" stroke-width="8"/>
<text x="408" y="151" fill="#613d2b" font-size="29" font-family="serif">直指</text>
<!-- low-floor perspective and mat at bottom edge -->
<path d="M0 414Q450 365 900 414V506H0Z" fill="#65472f"/>
<path d="M0 446Q450 397 900 446M0 480Q450 438 900 480" fill="none" stroke="#b18b58" stroke-width="7" opacity=".7"/>
<path d="M0 0H900V506H0Z" fill="none" stroke="#120e0b" stroke-width="44" opacity=".2"/>
</g>
<!-- Monk enters the viewer's field of vision -->
<g id="monk" class="hidden" transform="translate(674 195)">
<ellipse cx="71" cy="277" rx="76" ry="14" fill="#201710" opacity=".45"/>
<path d="M35 142Q70 121 106 142L136 248L118 274H19L3 240Z" fill="url(#robe)" stroke="#683c30" stroke-width="5"/>
<path d="M54 143L72 166L91 143" fill="#e2cf9f"/><path d="M70 164L81 175L76 247H62Z" fill="#d7b978"/>
<path d="M27 160L4 222M111 160L137 211" stroke="#d5a17e" stroke-width="20" stroke-linecap="round"/>
<path d="M42 248L38 278M95 248L103 278" stroke="#4a3b30" stroke-width="22" stroke-linecap="round"/>
<ellipse cx="71" cy="91" rx="43" ry="50" fill="#dca985" stroke="#895c45" stroke-width="3"/>
<path d="M29 86Q30 39 71 39Q111 40 113 88L101 74Q72 83 42 69Z" fill="#544438"/>
<path d="M47 95H60M82 95H95" stroke="#43312a" stroke-width="5"/><path d="M58 119Q71 112 84 119" stroke="#78493b" stroke-width="4" fill="none"/>
<g id="broom" style="display:none"><path d="M130 194L188 77" stroke="#684a2e" stroke-width="11" stroke-linecap="round"/><path d="M168 58L202 80L182 104L154 81Z" fill="#caa660" stroke="#684a2e" stroke-width="5"/></g>
</g>
</svg>
<div id="eye-top" class="eyelid"></div><div id="eye-bottom" class="eyelid"></div>
<div id="dialogue"><span id="speaker">당신</span><p id="text"></p><div id="actions"></div></div>
</section>
<footer>제1장 · 현재에서 고려 시대로</footer>
</main>
<script>
const q=(s)=>document.querySelector(s),stage=q("#stage"),home=q("#homeScene"),temple=q("#templeScene"),monk=q("#monk"),broom=q("#broom"),speaker=q("#speaker"),text=q("#text"),actions=q("#actions"),locationLabel=q("#location");
function buttons(items){actions.replaceChildren();for(const item of items){const b=document.createElement("button");b.type="button";b.textContent=item.label;if(item.primary)b.className="primary";b.addEventListener("click",item.run);actions.append(b)}}
function setScene(place){const isTemple=place==="temple";home.style.display=isTemple?"none":"";temple.style.display=isTemple?"":"none";locationLabel.textContent=isTemple?"고려 시대 · 절 안":"현재 · 침대에 누워서"}
function dialogue(name,line,items=[]){speaker.textContent=name;text.textContent=line;buttons(items)}
function closeEyes(done){stage.classList.remove("opening");void stage.offsetWidth;stage.classList.add("closing");setTimeout(()=>{stage.classList.remove("closing");if(done)done()},1750)}
function openEyes(done){stage.classList.remove("closing");void stage.offsetWidth;stage.classList.add("opening");setTimeout(()=>{stage.classList.remove("opening");if(done)done()},1500)}
function reset(){stage.classList.remove("closing","opening","hit","flinch");setScene("home");monk.setAttribute("class","hidden");monk.setAttribute("transform","translate(674 195)");broom.style.display="none";dialogue("당신","집에 돌아와 침대에 누웠습니다.\n“이제 좀 자야겠다.”",[{label:"잠든다",primary:true,run:sleepToTemple}])}
function sleepToTemple(){dialogue("당신","눈꺼풀이 천천히 내려옵니다. 방 안의 불빛이 흐려지고, 당신은 잠에 빠져듭니다.");closeEyes(()=>{setScene("temple");monk.setAttribute("class","hidden");openEyes(()=>showWake())})}
function showWake(){dialogue("당신","눈을 떠 보니 고려 시대의 절이었습니다.\n“여긴 어디지?” 어리둥절한 당신은 주위를 살폈습니다.",[{label:"주변을 둘러본다",primary:true,run:look},{label:"다시 잔다",run:dozeAgain}])}
function look(){monk.style.display="";monk.setAttribute("class","visible");monk.setAttribute("transform","translate(685 197)");stage.classList.remove("hit");void stage.offsetWidth;stage.classList.add("hit");dialogue("당신","절 안을 둘러보던 순간, 누군가 머리를 툭 쳤습니다.\n“아야!” 아픈 머리를 감싸고 옆을 돌아봤습니다.",[{label:"옆을 돌아본다",primary:true,run:meetMonk}])}
function dozeAgain(){dialogue("당신","다시 잠을 청하려고 눈을 감았습니다.");closeEyes(()=>{monk.setAttribute("class","visible");monk.setAttribute("transform","translate(685 197)");broom.style.display="";openEyes(()=>dialogue("당신","갑자기 스님이 빗자루로 당신을 때렸습니다!\n“아야! 누구야?!!”",[{label:"소리가 난 쪽을 본다",primary:true,run:meetMonk}]))})}
function meetMonk(){broom.style.display="none";monk.setAttribute("transform","translate(530 197)");dialogue("스님","스님이 가까이 다가오며 물었습니다.\n“여기서 뭐 하는 게냐?”",[{label:"깜짝 놀라 비명을 지른다",primary:true,run:scream}])}
function scream(){stage.classList.remove("flinch");void stage.offsetWidth;stage.classList.add("flinch");dialogue("당신","“아아악!” 갑자기 다가온 스님에 놀라 비명을 질렀습니다.",[{label:"제1장 다시 보기",primary:true,run:reset}])}
q("#restart").addEventListener("click",reset);reset();
</script>
</body>
</html>
